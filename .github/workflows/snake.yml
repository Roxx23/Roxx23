name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs twice a day
  workflow_dispatch:          # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Roxx23
          outputs: |
            dist/github-snake.svg?color_snake=#ec3013&color_dots=#eae9e9,#ffc4b8,#ff9783,#ff563c,#ec3013
            dist/github-snake-dark.svg?color_snake=#ec3013&color_dots=#201e1d,#4d170e,#7c1405,#ae1800,#ec3013
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
