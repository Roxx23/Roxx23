<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Ayush Bora — GenAI Engineer">
  <defs>
    <clipPath id="kickerClip"><rect x="30" y="30" width="0" height="24"><animate attributeName="width" values="0;300" dur="0.7s" begin="0.15s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/></rect></clipPath>
    <clipPath id="nameClip"><rect x="30" y="58" width="0" height="84"><animate attributeName="width" values="0;790" dur="0.95s" begin="0.35s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1000" height="260" fill="#201e1d"/>

  <rect x="820" y="0" width="180" height="0" fill="#ec3013">
    <animate attributeName="height" values="0;260" dur="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/>
  </rect>
  <g font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" fill="#f3f2f2">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="0.55s" begin="0.55s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/><text x="846" y="155" font-size="88" letter-spacing="-2.5">AB</text></g>
  </g>
  <rect x="820" y="-40" width="180" height="34" fill="#f3f2f2" opacity="0.14">
    <animate attributeName="y" values="-40;260" dur="7s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#kickerClip)">
    <text x="38" y="46" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#ff9783">GENAI ENGINEER &#183; LLM SYSTEMS</text>
  </g>
  <g clip-path="url(#nameClip)">
    <text x="34" y="128" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-1.2" fill="#f3f2f2">AYUSH BORA</text>
  </g>

  <rect x="38" y="152" width="0" height="2" fill="#f3f2f2"><animate attributeName="width" values="0;744" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/></rect>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.6s" begin="1s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/>
    <text x="38" y="184" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#f3f2f2" fill-opacity="0.72">Retrieval pipelines, agent workflows, and the production layer.</text>
  </g>

  <rect x="0" y="206" width="0" height="2" fill="#f3f2f2"><animate attributeName="width" values="0;820" dur="0.9s" begin="1.05s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/></rect>
  <g fill="#f3f2f2" fill-opacity="0.4">
    <rect x="233" y="208" width="2" height="0"><animate attributeName="height" values="0;52" dur="0.45s" begin="1.35s" fill="freeze"/></rect>
    <rect x="428" y="208" width="2" height="0"><animate attributeName="height" values="0;52" dur="0.45s" begin="1.45s" fill="freeze"/></rect>
    <rect x="623" y="208" width="2" height="0"><animate attributeName="height" values="0;52" dur="0.45s" begin="1.55s" fill="freeze"/></rect>
  </g>
  <g font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.8" fill="#f3f2f2">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.30s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.45s" begin="1.30s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/><text x="38" y="238">RAG</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.40s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.45s" begin="1.40s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/><text x="259" y="238">AGENTS</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.50s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.45s" begin="1.50s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/><text x="454" y="238">EVALS</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.60s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="0.45s" begin="1.60s" calcMode="spline" keyTimes="0;1" keySplines="0.16 0 0 1" fill="freeze"/><text x="649" y="238">PRODUCTION</text></g>
  </g>
  <rect x="38" y="248" width="0" height="3" fill="#ec3013">
    <animate attributeName="width" values="0;28" dur="0.35s" begin="1.8s" fill="freeze"/>
    <animate attributeName="x" values="38;259;454;649" dur="6.4s" calcMode="discrete" begin="1.8s" repeatCount="indefinite"/>
  </rect>

  <rect x="38" y="0" width="2" height="206" fill="#f3f2f2" opacity="0">
    <animate attributeName="x" values="38;782" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0" keyTimes="0;0.1;0.8;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="998" height="258" fill="none" stroke="#f3f2f2" stroke-width="2"/>
</svg>
