<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Ayush Bora — GenAI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="redFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E10600" stop-opacity="0.2"/>
      <stop offset="50%"  stop-color="#E10600" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF4B45" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="traceFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E10600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E10600" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="260" rx="14"/>
    </clipPath>

    <clipPath id="scopeClip">
      <rect x="560" y="52" width="400" height="150"/>
    </clipPath>

    <path id="trace"
          pathLength="1"
          d="M 560 175 L 600 172 L 625 120 L 665 112 L 690 158 L 730 150
             L 755 88 L 800 82 L 825 140 L 862 132 L 888 70 L 925 66 L 960 128"/>
  </defs>

  <g clip-path="url(#card)">

    <!-- backdrop -->
    <rect width="1000" height="260" fill="#0D1117"/>

    <!-- drifting diagonal speed streaks -->
    <g opacity="0.07" stroke="#E10600" stroke-width="2">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="0 0" to="120 0" dur="3s" repeatCount="indefinite"/>
        <line x1="-120" y1="260" x2="20"  y2="0"/>
        <line x1="0"    y1="260" x2="140" y2="0"/>
        <line x1="120"  y1="260" x2="260" y2="0"/>
        <line x1="240"  y1="260" x2="380" y2="0"/>
        <line x1="360"  y1="260" x2="500" y2="0"/>
        <line x1="480"  y1="260" x2="620" y2="0"/>
        <line x1="600"  y1="260" x2="740" y2="0"/>
        <line x1="720"  y1="260" x2="860" y2="0"/>
        <line x1="840"  y1="260" x2="980" y2="0"/>
        <line x1="960"  y1="260" x2="1100" y2="0"/>
      </g>
    </g>

    <!-- ================= LEFT: identity ================= -->

    <!-- status pill -->
    <g transform="translate(52, 46)">
      <rect x="0" y="0" width="232" height="26" rx="13"
            fill="#E10600" fill-opacity="0.12" stroke="#E10600" stroke-opacity="0.5"/>
      <circle cx="16" cy="13" r="4.5" fill="#E10600">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;5.5;4.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="17.5" font-family="'SF Mono',Consolas,monospace"
            font-size="11" letter-spacing="1.6" fill="#FF6B66">
        OPEN TO OPPORTUNITIES
      </text>
    </g>

    <!-- name -->
    <text x="50" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="58" font-weight="700" letter-spacing="1" fill="#F0F6FC">
      AYUSH BORA
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    </text>

    <!-- underline sweep -->
    <rect x="50" y="148" width="0" height="3" rx="1.5" fill="url(#redFade)">
      <animate attributeName="width" values="0;300" dur="1.1s" begin="0.4s" fill="freeze"/>
    </rect>

    <!-- role -->
    <text x="52" y="182" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="17" fill="#8B949E" letter-spacing="0.4">
      GenAI Engineer · LLM Systems · Product
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
    </text>

    <!-- rotating capability line -->
    <text x="52" y="212" font-family="'SF Mono',Consolas,monospace"
          font-size="13" fill="#E10600" letter-spacing="0.8">
      <tspan>
        RAG pipelines
        <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="52">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="52" y="212" font-family="'SF Mono',Consolas,monospace"
          font-size="13" fill="#E10600" letter-spacing="0.8" opacity="0">
      Multi-agent workflows
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" dur="9s" begin="1.4s" repeatCount="indefinite"/>
    </text>
    <text x="52" y="212" font-family="'SF Mono',Consolas,monospace"
          font-size="13" fill="#E10600" letter-spacing="0.8" opacity="0">
      Production LLM systems
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="9s" begin="1.4s" repeatCount="indefinite"/>
    </text>

    <!-- ================= RIGHT: telemetry scope ================= -->

    <rect x="560" y="52" width="400" height="150" rx="8"
          fill="#010409" stroke="#21262D" stroke-width="1"/>

    <text x="574" y="45" font-family="'SF Mono',Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#484F58">
      TELEMETRY / LAP 01
    </text>

    <g clip-path="url(#scopeClip)">
      <!-- grid -->
      <g stroke="#21262D" stroke-width="1" opacity="0.6">
        <line x1="560" y1="90"  x2="960" y2="90"/>
        <line x1="560" y1="127" x2="960" y2="127"/>
        <line x1="560" y1="164" x2="960" y2="164"/>
      </g>

      <!-- area under trace -->
      <path d="M 560 175 L 600 172 L 625 120 L 665 112 L 690 158 L 730 150
               L 755 88 L 800 82 L 825 140 L 862 132 L 888 70 L 925 66 L 960 128
               L 960 202 L 560 202 Z"
            fill="url(#traceFill)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="1s" begin="2.6s" fill="freeze"/>
      </path>

      <!-- the trace, drawing itself -->
      <use href="#trace" fill="none" stroke="#E10600" stroke-width="2.5"
           stroke-linejoin="round" stroke-linecap="round"
           stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0" dur="2.4s"
                 begin="0.6s" fill="freeze"/>
      </use>

      <!-- travelling readout dot -->
      <circle r="4" fill="#FFFFFF" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
        <animateMotion dur="2.4s" begin="0.6s" fill="freeze">
          <mpath href="#trace"/>
        </animateMotion>
      </circle>

      <!-- scanline sweep -->
      <rect x="560" y="52" width="2" height="150" fill="#E10600" opacity="0.5">
        <animate attributeName="x" values="560;960" dur="4s" begin="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- scope readouts -->
    <g font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#484F58">
      <text x="574" y="196">DEPLOY</text>
      <text x="700" y="196">LATENCY</text>
      <text x="850" y="196">UPTIME</text>
    </g>

    <!-- ================= bottom checkered strip ================= -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="1000" height="12" fill="#161B22"/>
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="0 0" to="24 0" dur="1.2s" repeatCount="indefinite"/>
        <g fill="#E10600">
          <rect x="-24" y="0" width="12" height="6"/><rect x="-12" y="6" width="12" height="6"/>
          <rect x="0"   y="0" width="12" height="6"/><rect x="12"  y="6" width="12" height="6"/>
          <rect x="24"  y="0" width="12" height="6"/><rect x="36"  y="6" width="12" height="6"/>
          <rect x="48"  y="0" width="12" height="6"/><rect x="60"  y="6" width="12" height="6"/>
          <rect x="72"  y="0" width="12" height="6"/><rect x="84"  y="6" width="12" height="6"/>
          <rect x="96"  y="0" width="12" height="6"/><rect x="108" y="6" width="12" height="6"/>
          <rect x="120" y="0" width="12" height="6"/><rect x="132" y="6" width="12" height="6"/>
          <rect x="144" y="0" width="12" height="6"/><rect x="156" y="6" width="12" height="6"/>
          <rect x="168" y="0" width="12" height="6"/><rect x="180" y="6" width="12" height="6"/>
          <rect x="192" y="0" width="12" height="6"/><rect x="204" y="6" width="12" height="6"/>
          <rect x="216" y="0" width="12" height="6"/><rect x="228" y="6" width="12" height="6"/>
          <rect x="240" y="0" width="12" height="6"/><rect x="252" y="6" width="12" height="6"/>
          <rect x="264" y="0" width="12" height="6"/><rect x="276" y="6" width="12" height="6"/>
          <rect x="288" y="0" width="12" height="6"/><rect x="300" y="6" width="12" height="6"/>
          <rect x="312" y="0" width="12" height="6"/><rect x="324" y="6" width="12" height="6"/>
          <rect x="336" y="0" width="12" height="6"/><rect x="348" y="6" width="12" height="6"/>
          <rect x="360" y="0" width="12" height="6"/><rect x="372" y="6" width="12" height="6"/>
          <rect x="384" y="0" width="12" height="6"/><rect x="396" y="6" width="12" height="6"/>
          <rect x="408" y="0" width="12" height="6"/><rect x="420" y="6" width="12" height="6"/>
          <rect x="432" y="0" width="12" height="6"/><rect x="444" y="6" width="12" height="6"/>
          <rect x="456" y="0" width="12" height="6"/><rect x="468" y="6" width="12" height="6"/>
          <rect x="480" y="0" width="12" height="6"/><rect x="492" y="6" width="12" height="6"/>
          <rect x="504" y="0" width="12" height="6"/><rect x="516" y="6" width="12" height="6"/>
          <rect x="528" y="0" width="12" height="6"/><rect x="540" y="6" width="12" height="6"/>
          <rect x="552" y="0" width="12" height="6"/><rect x="564" y="6" width="12" height="6"/>
          <rect x="576" y="0" width="12" height="6"/><rect x="588" y="6" width="12" height="6"/>
          <rect x="600" y="0" width="12" height="6"/><rect x="612" y="6" width="12" height="6"/>
          <rect x="624" y="0" width="12" height="6"/><rect x="636" y="6" width="12" height="6"/>
          <rect x="648" y="0" width="12" height="6"/><rect x="660" y="6" width="12" height="6"/>
          <rect x="672" y="0" width="12" height="6"/><rect x="684" y="6" width="12" height="6"/>
          <rect x="696" y="0" width="12" height="6"/><rect x="708" y="6" width="12" height="6"/>
          <rect x="720" y="0" width="12" height="6"/><rect x="732" y="6" width="12" height="6"/>
          <rect x="744" y="0" width="12" height="6"/><rect x="756" y="6" width="12" height="6"/>
          <rect x="768" y="0" width="12" height="6"/><rect x="780" y="6" width="12" height="6"/>
          <rect x="792" y="0" width="12" height="6"/><rect x="804" y="6" width="12" height="6"/>
          <rect x="816" y="0" width="12" height="6"/><rect x="828" y="6" width="12" height="6"/>
          <rect x="840" y="0" width="12" height="6"/><rect x="852" y="6" width="12" height="6"/>
          <rect x="864" y="0" width="12" height="6"/><rect x="876" y="6" width="12" height="6"/>
          <rect x="888" y="0" width="12" height="6"/><rect x="900" y="6" width="12" height="6"/>
          <rect x="912" y="0" width="12" height="6"/><rect x="924" y="6" width="12" height="6"/>
          <rect x="936" y="0" width="12" height="6"/><rect x="948" y="6" width="12" height="6"/>
          <rect x="960" y="0" width="12" height="6"/><rect x="972" y="6" width="12" height="6"/>
          <rect x="984" y="0" width="12" height="6"/><rect x="996" y="6" width="12" height="6"/>
        </g>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="999" height="259" rx="14"
          fill="none" stroke="#21262D" stroke-width="1"/>
  </g>
</svg>
